spring.datasource.data-source-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:D:\\localDB\\demodb
spring.datasource.username=ppldemo
spring.datasource.password=nttdata
spring.datasource.sql-script-encoding=UTF-8

# Enabling H2 Console
spring.h2.console.enabled=true

# Custom H2 Console URL
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true
# spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# server port
server.port=8889

#logging.level.root=DEBUG
logging.file.name=D:\\localDB\\demo.log
#logging.path=${APP_LOG_DIR}

spring.profiles.active=prod
